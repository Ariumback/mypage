<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>MyPage</title>
        <style>
            body {
                text-align: center;
                background-color: #e8e2e252;
                font-family: sans-serif;
            }
            nav {
                background-color: #dbceac;
                border-radius: 30px;
                padding: 20px;
                margin-bottom: 30pm;
            }
            nav a {
                width: auto;
                display: inline-block;   /* これで幅や高さを指定できるようになる */
                background-color: white;  /* ボタンの色（黒） */
                border: 0.0px solid #000; /* 黒い枠線 */ 
                color: black;            /* 文字の色（白） */
                text-decoration: none;   /* 下線を消す */
                padding: 20px 40px;      /* ボタンの大きさ（上下10px、左右30px） */
                border-radius: 30px;      /* 角を少し丸くする */
                margin: 0 10px;          /* ボタン同士の隙間 */
                transition: 0.3s;    
                box-sizing: border-box;    /* ホバー時の動きを滑らかに */
                box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* ほんのり影をつける */
                transition: 0.3s;
            }
            nav a:hover {
                transform: translateY(-5px);  /* 上に5ピクセル移動する */
                box-shadow: 0 8px 16px rgba(0,0,0,0.2); /* 影を濃く・大きくする */
            }
            h1 {
                color: #333333;
            }
            h2 {
                color: #0056b3;
                margin-top: 60px;
            }
            h3 {
                color: #0056b3;
                font-weight: bold;
            }
            ul {
                list-style: none;
                padding: 0;
            }
            li {
                display: inline-block;
                background-color: #fff;
                color: #333;
                padding: 10px 20px;
                border-radius: 20px;
                margin: 5px;
            }
            .card {
                background-color: white;       /* 背景を白く */
                width: 80%;                    /* 幅を画面の80%に */
                margin: 20px auto;             /* 上下に隙間、左右は自動で真ん中に */
                padding: 20px;                 /* 内側に隙間 */
                border-radius: 10px;           /* 角を丸く */
                box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* ほんのり影をつける */
                transition: 0.3s;
            }
            .card:hover {
                transform: translateY(-5px);  /* 上に5ピクセル移動する */
                box-shadow: 0 8px 16px rgba(0,0,0,0.2); /* 影を濃く・大きくする */
            }

            .img-parameter {
                width: 150px;
                height: 150px;
                object-fit: cover;
                border-radius: 50%;
            }

            @media (min-width: 768px) {

                .card-list {
                    display: flex;        /* 横並びモードON */
                    flex-wrap: wrap;      /* 入り切らなかったら折り返す */
                    justify-content: center; /* 真ん中寄せ */
                    gap: 20px;            /* カード同士の隙間 */
                }

                .card {
                    width: 40%;           /* 画面の40%の幅にする（これで2列になる） */
                    margin: 0;            /* 親箱のgapで隙間を作るので、marginはリセット */
                }
            }
        </style>
    </head>
