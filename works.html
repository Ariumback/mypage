<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>MyPage</title>
        <style>
            body {
                text-align: center;
                background-color: #e8e2e252;
                font-family: sans-serif;
            }
            nav {
                background-color: #D3C6A6;
                padding: 15px;
                margin-bottom: 30pm;
            }
            h1 {
                color: #333333;
            }
            h2 {
                color: #0056b3;
                margin-top: 60px;
            }
            h3 {
                color: #0056b3;
                font-weight: bold;
            }
            ul {
                list-style: none;
                padding: 0;
            }
            li {
                display: inline-block;
                background-color: #fff;
                color: #333;
                padding: 10px 20px;
                border-radius: 20px;
                margin: 5px;
            }
            .card {
                background-color: white;       /* 背景を白く */
                width: 80%;                    /* 幅を画面の80%に */
                margin: 20px auto;             /* 上下に隙間、左右は自動で真ん中に */
                padding: 20px;                 /* 内側に隙間 */
                border-radius: 10px;           /* 角を丸く */
                box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* ほんのり影をつける */
                transition: 0.3s;
            }
            .card:hover {
                transform: translateY(-5px);  /* 上に5ピクセル移動する */
                box-shadow: 0 8px 16px rgba(0,0,0,0.2); /* 影を濃く・大きくする */
            }

            .img-parameter {
                width: 150px;
                height: 150px;
                object-fit: cover;
                border-radius: 50%;
            }

            @media (min-width: 768px) {

                .card-list {
                    display: flex;        /* 横並びモードON */
                    flex-wrap: wrap;      /* 入り切らなかったら折り返す */
                    justify-content: center; /* 真ん中寄せ */
                    gap: 20px;            /* カード同士の隙間 */
                }

                .card {
                    width: 40%;           /* 画面の40%の幅にする（これで2列になる） */
                    margin: 0;            /* 親箱のgapで隙間を作るので、marginはリセット */
                }
            }
        </style>
    </head>

        </nav>

            </div>

        </div>
    </body>
</html>
