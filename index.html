<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>ポートフォリオ</title>
        <style>
            body {
                text-align: center;
                background-color: #e8e2e252;
                font-family: sans-serif;
            }
            h1 {
                color: #333333;
            }
            h2 {
                color: #0056b3;
                margin-top: 60px;
            }
            ul {
                list-style: none;
                padding: 0;
            }
            li {
                display: inline-block;
                background-color: #fff;
                color: #333;
                padding: 10px 20px;
                border-radius: 20px;
                margin: 5px;
            }
            .card {
                background-color: white;       /* 背景を白く */
                width: 80%;                    /* 幅を画面の80%に */
                margin: 20px auto;             /* 上下に隙間、左右は自動で真ん中に */
                padding: 20px;                 /* 内側に隙間 */
                border-radius: 10px;           /* 角を丸く */
                box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* ほんのり影をつける */
                transition: 0.3s;
            }
            .card:hover {
                transform: translateY(-5px);  /* 上に5ピクセル移動する */
                box-shadow: 0 8px 16px rgba(0,0,0,0.2); /* 影を濃く・大きくする */
            }
        </style>
    </head>
    <body>
        <h1>ポートフォリオ</h1>
            <p>私の名前</p>
        <h2>私のこと</h2>
            <p>
                <img src = "https://placehold.jp/150x150.png" alt = "プロフィール">
            </p>
            <ul>
                <li>Java</li>
                <li>Python</li>
            </ul>
        <h2>私の作品</h2>
            <div class = "card">
                <h3>あいうえお</h3>
                    <p>やっぱっぱー</p>
            </div>
            <div class = "card">
                <h3>あいうえこ</h3>
                    <p>やっぱっぱー</p>
            </div>
            <div class = "card">
                <h3>あいうえそ</h3>
                    <p>やっぱっぱー</p>
            </div>
            <div class = "card">
                    <h3>あいうえと</h3>
                        <p>やっぱっぱー</p>
            </div>
                
        <h2>私の連絡先</h2>
            <p>
                連絡は<a href = "URL">こちら</a>から
            </p>
    </body>
</html>
